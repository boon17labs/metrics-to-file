name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: unit-tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      # Let every Java version report, so a failure on one shows whether the
      # other passes.
      fail-fast: false
      matrix:
        # 8 is the project's documented minimum (see CLAUDE.md), 17 a recent LTS.
        java: ['8', '17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Run unit tests
        run: mvn -B test

  integration-tests:
    name: integration-tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Run integration tests
        run: mvn -B test-compile failsafe:integration-test failsafe:verify
